name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (PySpark + dbt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=midas --cov-report=term-missing --cov-fail-under=90
      - name: dbt parse (valida modelos, refs y tests)
        working-directory: dbt
        run: dbt parse --profiles-dir .

  airflow:
    name: DAG de Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install "apache-airflow>=3.0,<4" pytest
      - run: pytest tests/test_dag.py --noconftest -q

  audit:
    name: vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install pip-audit
          pip install ".[ui]"
          pip-audit --skip-editable

  docker:
    name: imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t midas-airflow:ci .
      - run: docker run --rm --entrypoint midas midas-airflow:ci --help

  vitrina:
    name: imagen de la demo web (vitrina)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile.vitrina -t midas-vitrina:ci .
      - name: la vitrina responde y publica gold para ATLAS
        run: |
          docker run -d --name vitrina -p 8100:8100 midas-vitrina:ci
          for i in $(seq 1 30); do curl -sf localhost:8100/healthz && break; sleep 1; done
          curl -sf localhost:8100/api/meta | grep -q '"vitrina":true'
          curl -sf localhost:8100/vitrina/gold/_manifest.json | grep -q '"run_id"'
          curl -sf -o /dev/null localhost:8100/vitrina/gold/pagos_gold.parquet
