midas:
  target: "{{ env_var('MIDAS_DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('MIDAS_DUCKDB', '../data/warehouse/midas.duckdb') }}"
      external_root: "{{ env_var('MIDAS_LAKE', '../data/lake') }}/gold"
      threads: 4
    aws:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      s3_staging_dir: "{{ env_var('MIDAS_ATHENA_RESULTS', 's3://midas-dev-athena-results/') }}"
      s3_data_dir: "{{ env_var('MIDAS_GOLD_S3', 's3://midas-dev-lake/gold/') }}"
      database: awsdatacatalog
      schema: midas_gold
      work_group: midas
      threads: 4
