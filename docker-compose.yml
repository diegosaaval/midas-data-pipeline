# Entorno local completo:  docker compose up --build   ->  Airflow en http://localhost:8080
# Correr el pipeline sin Airflow:  docker compose run --rm midas run
x-midas-env: &midas-env
  MIDAS_SCALE: ${MIDAS_SCALE:-0.5}
  MIDAS_SIMULATE_SOURCES: "true"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: {context: ., dockerfile: docker/Dockerfile}
    image: midas-airflow:latest
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *midas-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # solo para desarrollo local
    command: standalone
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - lake:/opt/midas/data

  midas:
    image: midas-airflow:latest
    depends_on: [airflow]
    environment: *midas-env
    entrypoint: ["midas"]
    command: ["status"]
    volumes: [lake:/opt/midas/data]
    profiles: ["cli"]

volumes:
  pg-data:
  lake:
