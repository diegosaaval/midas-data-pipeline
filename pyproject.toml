[project]
name = "midas"
version = "0.1.0"
description = "Pipeline de datos financieros: landing -> bronze -> silver (PySpark) -> gold (dbt), orquestado con Airflow."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "pyspark>=4.0,<5",
  "pyarrow>=15",
  "pandas>=2.2,<3",
  "duckdb>=1.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["midas[ui]", "httpx>=0.28.1", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
aws = ["boto3>=1.34", "dbt-athena-community>=1.9"]

[project.scripts]
midas = "midas.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"midas.ui" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 130
extend-exclude = ["media"]  # guiones de los videos, no son código del producto
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
