name: midas
version: "0.1.0"
config-version: 2
profile: midas

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  late_data_days: 7      # ventana de reproceso del modelo incremental (debe cubrir la de silver)
  usd_cop: 4000          # tasa fija de referencia para normalizar montos en USD

models:
  midas:
    staging:
      +materialized: view
    marts:
      +materialized: table
    gold:
      # Local: Parquet en lake/gold (lo que ATLAS monitorea). En Athena: tablas normales.
      +materialized: "{{ 'external' if target.type == 'duckdb' else 'table' }}"
