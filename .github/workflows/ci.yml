name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (PySpark + dbt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=finflow --cov-report=term-missing
      - name: dbt parse (valida modelos, refs y tests)
        working-directory: dbt
        run: dbt parse --profiles-dir .

  airflow:
    name: DAG de Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "apache-airflow>=3.0,<4" pytest
      - run: pytest tests/test_dag.py --noconftest -q

  docker:
    name: imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t finflow-airflow:ci .
      - run: docker run --rm --entrypoint finflow finflow-airflow:ci --help
